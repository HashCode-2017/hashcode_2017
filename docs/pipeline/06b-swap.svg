<svg xmlns="http://www.w3.org/2000/svg" width="960" height="616" viewBox="0 0 960 616" role="img" aria-label="How a swap works, step by step" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
<title>How a swap works, step by step</title>
<defs><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#008300"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e34948"/></marker><marker id="m-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6250d6"/></marker><marker id="m-aqua" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1baf7a"/></marker><marker id="m-magenta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c94f7f"/></marker><marker id="m-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b07800"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fbe2e2"/><line x1="0" y1="0" x2="0" y2="8" stroke="#e34948" stroke-width="2" opacity="0.55"/></pattern></defs>
<rect x="0.5" y="0.5" width="959" height="615" rx="14" fill="#fcfcfb" stroke="#e4e3df"/>
<rect x="28" y="20" width="133" height="22" rx="11.0" fill="#ebe8fa" stroke="#6250d6" stroke-width="1.2"/>
<text x="95" y="35" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">STAGE 1 · GREEDY</text>
<text x="173" y="39" font-size="20" font-weight="700" fill="#0b0b0b" text-anchor="start">Swap: make room for a better video, if the trade pays off</text>
<text x="28" y="64" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">The cache is full, but a video outside would help a lot. Is it worth throwing something out?</text>
<circle cx="58" cy="98" r="14" fill="#ebe8fa" stroke="#6250d6" stroke-width="1.5"/>
<text x="58" y="103" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">1</text>
<text x="84" y="103" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">The cache is full</text>
<text x="84" y="126" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">The cache (100 MB) holds X, Y and Z, 30 MB each,</text>
<text x="84" y="145" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">and only 10 MB is free. Video W needs 60 MB and</text>
<text x="84" y="164" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">would save 1500 ms, but it does not fit.</text>
<rect x="520" y="88" width="106.0" height="32" rx="4" fill="#2a78d6"/>
<text x="574.0" y="109" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">X saves 300</text>
<rect x="628.0" y="88" width="106.0" height="32" rx="4" fill="#2a78d6"/>
<text x="682.0" y="109" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Y saves 600</text>
<rect x="736.0" y="88" width="106.0" height="32" rx="4" fill="#2a78d6"/>
<text x="790.0" y="109" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Z saves 1800</text>
<rect x="844.0" y="88" width="34.0" height="32" rx="4" fill="#f1f0ec" stroke="#c9c8c2" stroke-width="1"/>
<text x="862.0" y="109" font-size="12" font-weight="700" fill="#52514e" text-anchor="middle">free</text>
<rect x="520" y="130" width="214.0" height="28" rx="4" fill="#ebe8fa" stroke="#6250d6" stroke-width="1.2"/>
<text x="628.0" y="149" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">W · 60 MB · would save 1500</text>
<text x="746.0" y="149" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">← waiting outside</text>
<circle cx="58" cy="220" r="14" fill="#ebe8fa" stroke="#6250d6" stroke-width="1.5"/>
<text x="58" y="225" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">2</text>
<text x="84" y="225" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">Rank the copies: who is least useful?</text>
<text x="84" y="248" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Per MB, X saves the least, then Y, then Z.</text>
<text x="84" y="267" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">The least useful copies are the first ones</text>
<text x="84" y="286" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">we would give up.</text>
<rect x="520" y="210" width="106.0" height="32" rx="4" fill="#2a78d6"/>
<text x="574.0" y="231" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">X saves 300</text>
<rect x="628.0" y="210" width="106.0" height="32" rx="4" fill="#2a78d6"/>
<text x="682.0" y="231" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Y saves 600</text>
<rect x="736.0" y="210" width="106.0" height="32" rx="4" fill="#2a78d6"/>
<text x="790.0" y="231" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Z saves 1800</text>
<rect x="844.0" y="210" width="34.0" height="32" rx="4" fill="#f1f0ec" stroke="#c9c8c2" stroke-width="1"/>
<text x="862.0" y="231" font-size="12" font-weight="700" fill="#52514e" text-anchor="middle">free</text>
<text x="574.0" y="260" font-size="12" font-weight="600" fill="#e34948" text-anchor="middle">1st to go</text>
<text x="682.0" y="260" font-size="12" font-weight="600" fill="#e34948" text-anchor="middle">2nd to go</text>
<text x="790.0" y="260" font-size="12" font-weight="600" fill="#52514e" text-anchor="middle">keep</text>
<circle cx="58" cy="326" r="14" fill="#ebe8fa" stroke="#6250d6" stroke-width="1.5"/>
<text x="58" y="331" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">3</text>
<text x="84" y="331" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">Make room, least useful first</text>
<text x="84" y="354" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Remove X: 40 MB free, still too small for W.</text>
<text x="84" y="373" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Remove Y too: 70 MB free, now W fits.</text>
<rect x="520" y="316" width="106.0" height="32" rx="4" fill="url(#hatch)" stroke="#e34948" stroke-width="1"/>
<text x="574.0" y="337" font-size="12" font-weight="700" fill="#e34948" text-anchor="middle">X out</text>
<rect x="628.0" y="316" width="106.0" height="32" rx="4" fill="url(#hatch)" stroke="#e34948" stroke-width="1"/>
<text x="682.0" y="337" font-size="12" font-weight="700" fill="#e34948" text-anchor="middle">Y out</text>
<rect x="736.0" y="316" width="106.0" height="32" rx="4" fill="#2a78d6"/>
<text x="790.0" y="337" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Z saves 1800</text>
<rect x="844.0" y="316" width="34.0" height="32" rx="4" fill="#f1f0ec" stroke="#c9c8c2" stroke-width="1"/>
<text x="862.0" y="337" font-size="12" font-weight="700" fill="#52514e" text-anchor="middle">free</text>
<circle cx="58" cy="420" r="14" fill="#ebe8fa" stroke="#6250d6" stroke-width="1.5"/>
<text x="58" y="425" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">4</text>
<text x="84" y="425" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">Is the trade worth it?</text>
<text x="84" y="448" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">We lose what X and Y saved: 300 + 600 = 900.</text>
<text x="84" y="467" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">We win what W saves: 1500.</text>
<text x="84" y="486" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">1500 is more than 900, so we are 600 better: swap!</text>
<rect x="520" y="410" width="106.0" height="32" rx="4" fill="#2a78d6"/>
<text x="574.0" y="431" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Z saves 1800</text>
<rect x="628.0" y="410" width="214.0" height="32" rx="4" fill="#008300"/>
<text x="736.0" y="431" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">W saves 1500</text>
<rect x="844.0" y="410" width="34.0" height="32" rx="4" fill="#f1f0ec" stroke="#c9c8c2" stroke-width="1"/>
<text x="862.0" y="431" font-size="12" font-weight="700" fill="#52514e" text-anchor="middle">free</text>
<text x="520" y="466" font-size="12" font-weight="600" fill="#008300" text-anchor="start">after the swap</text>
<rect x="28" y="512" width="904" height="84" rx="10" fill="#f1f0ec"/>
<text x="46" y="536" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">If we would lose more than we win, nothing changes.</text>
<text x="46" y="556" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">“X saves 300” means: without this copy, X&#x27;s users would wait 300 ms more in total (they fall back to the next best cache or the data center).</text>
<text x="46" y="576" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">For each cache the solver tries the 20 most valuable videos it does not hold, makes the best trade, then looks again (at most 50 trades per cache).</text>
</svg>
