<svg xmlns="http://www.w3.org/2000/svg" width="960" height="624" viewBox="0 0 960 624" role="img" aria-label="How the Large Neighbourhood Search works" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
<title>How the Large Neighbourhood Search works</title>
<defs><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#008300"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e34948"/></marker><marker id="m-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6250d6"/></marker><marker id="m-aqua" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1baf7a"/></marker><marker id="m-magenta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c94f7f"/></marker><marker id="m-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b07800"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fbe2e2"/><line x1="0" y1="0" x2="0" y2="8" stroke="#e34948" stroke-width="2" opacity="0.55"/></pattern></defs>
<rect x="0.5" y="0.5" width="959" height="623" rx="14" fill="#fcfcfb" stroke="#e4e3df"/>
<rect x="28" y="20" width="112" height="22" rx="11.0" fill="#fbe7ef" stroke="#e87ba4" stroke-width="1.2"/>
<text x="84" y="35" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">STAGE 3 · LNS</text>
<text x="152" y="39" font-size="20" font-weight="700" fill="#0b0b0b" text-anchor="start">Large Neighbourhood Search</text>
<text x="28" y="64" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">Destroy two linked caches, rebuild them together, keep the result if the score did not drop.</text>
<rect x="28" y="82" width="290" height="232" rx="12" fill="#fcfcfb" stroke="#e4e3df" stroke-width="1"/>
<text x="44" y="108" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="start">Now (re-pack is stuck)</text>
<rect x="58" y="126" width="100" height="54" rx="10" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="108.0" y="150" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="middle">C1</text>
<text x="108.0" y="167" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">holds B</text>
<rect x="188" y="126" width="100" height="54" rx="10" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="238.0" y="150" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="middle">C2</text>
<text x="238.0" y="167" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">holds A</text>
<rect x="58" y="230" width="110" height="48" rx="10" fill="#fde6dc" stroke="#eb6834" stroke-width="1.5"/>
<text x="113.0" y="251" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="middle">E0</text>
<text x="113.0" y="268" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">A×10, B×10</text>
<rect x="198" y="230" width="90" height="48" rx="10" fill="#fde6dc" stroke="#eb6834" stroke-width="1.5"/>
<text x="243.0" y="251" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="middle">E1</text>
<text x="243.0" y="268" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">A×1</text>
<line x1="98" y1="230" x2="108" y2="180" stroke="#2a78d6" stroke-width="1.5"/>
<line x1="138" y1="230" x2="228" y2="180" stroke="#2a78d6" stroke-width="1.5"/>
<line x1="228" y1="230" x2="128" y2="180" stroke="#2a78d6" stroke-width="1.5"/>
<text x="302" y="304" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="end">saving 18,000</text>
<rect x="334" y="82" width="300" height="232" rx="12" fill="#f1f0ec"/>
<text x="350" y="108" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">All links 100 ms, data center 1000 ms,</text>
<text x="350" y="126" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">each cache fits one video.</text>
<text x="350" y="156" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Re-pack C1 alone: E0 already gets A</text>
<text x="350" y="175" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">from C2, so A is worth 900 (E1 only)</text>
<text x="350" y="194" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">&lt; B&#x27;s 9,000 → keep B.</text>
<text x="350" y="213" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Re-pack C2 alone: B is worth 0</text>
<text x="350" y="232" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">(E0 gets B from C1) → keep A.</text>
<text x="350" y="251" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Neither single move helps.</text>
<rect x="642" y="82" width="290" height="232" rx="12" fill="#fcfcfb" stroke="#008300" stroke-width="2"/>
<text x="658" y="108" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="start">Both changed together</text>
<rect x="672" y="126" width="100" height="54" rx="10" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="722.0" y="150" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="middle">C1</text>
<text x="722.0" y="167" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">holds A</text>
<rect x="802" y="126" width="100" height="54" rx="10" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="852.0" y="150" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="middle">C2</text>
<text x="852.0" y="167" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">holds B</text>
<rect x="672" y="230" width="110" height="48" rx="10" fill="#fde6dc" stroke="#eb6834" stroke-width="1.5"/>
<text x="727.0" y="251" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="middle">E0</text>
<text x="727.0" y="268" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">A×10, B×10</text>
<rect x="812" y="230" width="90" height="48" rx="10" fill="#fde6dc" stroke="#eb6834" stroke-width="1.5"/>
<text x="857.0" y="251" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="middle">E1</text>
<text x="857.0" y="268" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">A×1</text>
<line x1="712" y1="230" x2="722" y2="180" stroke="#2a78d6" stroke-width="1.5"/>
<line x1="752" y1="230" x2="842" y2="180" stroke="#2a78d6" stroke-width="1.5"/>
<line x1="842" y1="230" x2="742" y2="180" stroke="#2a78d6" stroke-width="1.5"/>
<text x="916" y="304" font-size="13" font-weight="700" fill="#008300" text-anchor="end">saving 18,900</text>
<text x="46" y="352" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">One LNS step (repeated until the time budget is spent)</text>
<rect x="40" y="368" width="156" height="92" rx="10" fill="#fbe7ef" stroke="#e87ba4" stroke-width="1.5"/>
<text x="118.0" y="395" font-size="14" font-weight="650" fill="#0b0b0b" text-anchor="middle">1 · Pick</text>
<text x="118.0" y="412" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">random cache, then</text>
<text x="118.0" y="428" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">cache → endpoint →</text>
<text x="118.0" y="444" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">cache (k = 2)</text>
<line x1="196" y1="414" x2="220" y2="414" stroke="#c94f7f" stroke-width="1.5" marker-end="url(#m-magenta)"/>
<rect x="222" y="368" width="156" height="92" rx="10" fill="#fbe7ef" stroke="#e87ba4" stroke-width="1.5"/>
<text x="300.0" y="395" font-size="14" font-weight="650" fill="#0b0b0b" text-anchor="middle">2 · Remember</text>
<text x="300.0" y="412" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">their contents and</text>
<text x="300.0" y="428" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">saving S of the</text>
<text x="300.0" y="444" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">endpoints around</text>
<line x1="378" y1="414" x2="402" y2="414" stroke="#c94f7f" stroke-width="1.5" marker-end="url(#m-magenta)"/>
<rect x="404" y="368" width="156" height="92" rx="10" fill="#fbe7ef" stroke="#e87ba4" stroke-width="1.5"/>
<text x="482.0" y="403" font-size="14" font-weight="650" fill="#0b0b0b" text-anchor="middle">3 · Destroy</text>
<text x="482.0" y="420" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">empty both</text>
<text x="482.0" y="436" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">caches</text>
<line x1="560" y1="414" x2="584" y2="414" stroke="#c94f7f" stroke-width="1.5" marker-end="url(#m-magenta)"/>
<rect x="586" y="368" width="156" height="92" rx="10" fill="#fbe7ef" stroke="#e87ba4" stroke-width="1.5"/>
<text x="664.0" y="395" font-size="14" font-weight="650" fill="#0b0b0b" text-anchor="middle">4 · Repair</text>
<text x="664.0" y="412" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">re-pack just these 2,</text>
<text x="664.0" y="428" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">random order,</text>
<text x="664.0" y="444" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">until stable</text>
<line x1="742" y1="414" x2="766" y2="414" stroke="#c94f7f" stroke-width="1.5" marker-end="url(#m-magenta)"/>
<rect x="768" y="368" width="156" height="92" rx="10" fill="#fbe7ef" stroke="#e87ba4" stroke-width="1.5"/>
<text x="846.0" y="411" font-size="14" font-weight="650" fill="#0b0b0b" text-anchor="middle">5 · Compare</text>
<text x="846.0" y="428" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">new saving ≥ S ?</text>
<line x1="828" y1="460" x2="828" y2="476" stroke="#c94f7f" stroke-width="1.5"/>
<rect x="772" y="476" width="176" height="22" rx="11.0" fill="#e0f0e0" stroke="#008300" stroke-width="1.2"/>
<text x="860" y="491" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">✓ yes: keep (ties too)</text>
<rect x="772" y="508" width="112" height="22" rx="11.0" fill="#fbe2e2" stroke="#e34948" stroke-width="1.2"/>
<text x="828" y="523" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">✗ no: restore</text>
<path d="M772,488 H118 V462" fill="none" stroke="#c94f7f" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m-magenta)"/>
<path d="M772,520 H750 V488" fill="none" stroke="#c94f7f" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="400" y="506" font-size="12.5" font-weight="600" fill="#52514e" text-anchor="middle">next step</text>
<text x="46" y="572" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Only endpoints touching the 2 caches can change, so S is computed locally (no full re-score). Keeping ties lets the search drift across plateaus.</text>
<text x="46" y="592" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">k = 2 beat k = 4 and k = 8 (smaller groups → more steps per second). At the end: one full re-pack sweep over every cache.</text>
</svg>
