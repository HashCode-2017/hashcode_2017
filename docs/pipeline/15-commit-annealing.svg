<svg xmlns="http://www.w3.org/2000/svg" width="960" height="568" viewBox="0 0 960 568" role="img" aria-label="The annealing options added by the last commit" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
<title>The annealing options added by the last commit</title>
<defs><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#008300"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e34948"/></marker><marker id="m-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6250d6"/></marker><marker id="m-aqua" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1baf7a"/></marker><marker id="m-magenta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c94f7f"/></marker><marker id="m-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b07800"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fbe2e2"/><line x1="0" y1="0" x2="0" y2="8" stroke="#e34948" stroke-width="2" opacity="0.55"/></pattern></defs>
<rect x="0.5" y="0.5" width="959" height="567" rx="14" fill="#fcfcfb" stroke="#e4e3df"/>
<rect x="28" y="20" width="169" height="22" rx="11.0" fill="#f1f0ec" stroke="#52514e" stroke-width="1.2"/>
<text x="113" y="35" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">LAST COMMIT · d4abaea</text>
<text x="209" y="39" font-size="20" font-weight="700" fill="#0b0b0b" text-anchor="start">Optional: allow steps backwards (simulated annealing)</text>
<text x="28" y="64" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">Two new switches. Both are off by default, so solve.py and the runner behave exactly as before.</text>
<rect x="28" y="84" width="440" height="392" rx="12" fill="#fcfcfb" stroke="#e4e3df" stroke-width="1.5"/>
<text x="46" y="110" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">--temp T: sometimes keep a worse result</text>
<text x="46" y="130" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">used by LNS and by --moves</text>
<line x1="90" y1="290" x2="430" y2="290" stroke="#e4e3df" stroke-width="1"/>
<line x1="90" y1="154" x2="90" y2="290" stroke="#e4e3df" stroke-width="1"/>
<path d="M90,154 L430,290" fill="none" stroke="#e87ba4" stroke-width="2"/>
<text x="82" y="158" font-size="12" font-weight="700" fill="#52514e" text-anchor="end">T</text>
<text x="82" y="294" font-size="12" font-weight="700" fill="#52514e" text-anchor="end">0</text>
<text x="90" y="308" font-size="12" font-weight="400" fill="#8a8984" text-anchor="start">start</text>
<text x="430" y="308" font-size="12" font-weight="400" fill="#8a8984" text-anchor="end">end of the time budget</text>
<text x="54" y="226" font-size="12" font-weight="400" fill="#8a8984" text-anchor="middle">temp.</text>
<text x="210" y="162" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">early: bad steps often kept,</text>
<text x="210" y="178" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">so it can climb out of a dead end</text>
<text x="304" y="216" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">late: almost never kept,</text>
<text x="304" y="232" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">so it settles</text>
<text x="46" y="340" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="start">How likely is a worse result kept? (with --temp 1)</text>
<text x="60" y="364" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">at the start, 1 point worse</text>
<text x="300" y="364" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="end">37 %</text>
<text x="60" y="386" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">at the start, 3 points worse</text>
<text x="300" y="386" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="end">5 %</text>
<text x="60" y="408" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">near the end</text>
<text x="300" y="408" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="end">almost never</text>
<text x="46" y="450" font-size="12.5" font-weight="600" fill="#008300" text-anchor="start">The best layout seen is saved and put back at the end.</text>
<rect x="492" y="84" width="440" height="392" rx="12" fill="#fcfcfb" stroke="#e4e3df" stroke-width="1.5"/>
<text x="510" y="110" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">--moves S: tiny moves, tried very fast</text>
<text x="510" y="130" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">after the re-pack, for S seconds</text>
<text x="510" y="160" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="start">Swap: two caches that share users trade videos</text>
<rect x="516" y="172" width="74" height="46" rx="10" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="553.0" y="192" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="middle">C1</text>
<text x="553.0" y="209" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">holds a</text>
<rect x="600" y="172" width="74" height="46" rx="10" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="637.0" y="192" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="middle">C2</text>
<text x="637.0" y="209" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">holds b</text>
<line x1="684" y1="195" x2="738" y2="195" stroke="#c94f7f" stroke-width="2" marker-end="url(#m-magenta)"/>
<rect x="746" y="172" width="74" height="46" rx="10" fill="#fbe7ef" stroke="#e87ba4" stroke-width="1.5"/>
<text x="783.0" y="192" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="middle">C1</text>
<text x="783.0" y="209" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">holds b</text>
<rect x="830" y="172" width="74" height="46" rx="10" fill="#fbe7ef" stroke="#e87ba4" stroke-width="1.5"/>
<text x="867.0" y="192" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="middle">C2</text>
<text x="867.0" y="209" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">holds a</text>
<text x="510" y="254" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="start">Replace: a cache swaps one video for one its users ask for</text>
<rect x="516" y="266" width="74" height="46" rx="10" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="553.0" y="286" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="middle">C</text>
<text x="553.0" y="303" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">holds a</text>
<line x1="600" y1="289" x2="654" y2="289" stroke="#c94f7f" stroke-width="2" marker-end="url(#m-magenta)"/>
<rect x="662" y="266" width="74" height="46" rx="10" fill="#fbe7ef" stroke="#e87ba4" stroke-width="1.5"/>
<text x="699.0" y="286" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="middle">C</text>
<text x="699.0" y="303" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">holds b</text>
<text x="748" y="286" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">(or just add b</text>
<text x="748" y="302" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">if it already fits)</text>
<text x="510" y="350" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Why it is fast: only requests for a and b can change,</text>
<text x="510" y="369" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">so the score change is computed from those two videos</text>
<text x="510" y="388" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">only. Each move is tiny, so many more of them fit in</text>
<text x="510" y="407" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">the same time than LNS steps.</text>
<text x="510" y="426" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Kept if not worse, or by the --temp rule on the left.</text>
<rect x="28" y="490" width="904" height="58" rx="10" fill="#f1f0ec"/>
<text x="46" y="514" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="start" font-family="Consolas, 'SF Mono', Menlo, monospace">Try it:  solver in.in out.out --lns 300 --temp 1     or     solver in.in out.out --moves 300 --temp 1</text>
<text x="46" y="536" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">The right temperature differs per data set (PIPELINE.md), which is why it stays opt-in.</text>
</svg>
