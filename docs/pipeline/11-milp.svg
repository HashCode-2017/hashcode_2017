<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="The exact mixed-integer model" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
<title>The exact mixed-integer model</title>
<defs><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#008300"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e34948"/></marker><marker id="m-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6250d6"/></marker><marker id="m-aqua" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1baf7a"/></marker><marker id="m-magenta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c94f7f"/></marker><marker id="m-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b07800"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fbe2e2"/><line x1="0" y1="0" x2="0" y2="8" stroke="#e34948" stroke-width="2" opacity="0.55"/></pattern></defs>
<rect x="0.5" y="0.5" width="959" height="419" rx="14" fill="#fcfcfb" stroke="#e4e3df"/>
<rect x="28" y="20" width="126" height="22" rx="11.0" fill="#fcf0d4" stroke="#eda100" stroke-width="1.2"/>
<text x="91" y="35" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">STAGE 4 · EXACT</text>
<text x="166" y="39" font-size="20" font-weight="700" fill="#0b0b0b" text-anchor="start">The exact model (exact.py, HiGHS)</text>
<text x="28" y="64" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">Built on the example: only pairs that can save something become variables.</text>
<rect x="36" y="126" width="190" height="48" rx="10" fill="#fde6dc" stroke="#eb6834" stroke-width="1.5"/>
<text x="131.0" y="147" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="middle">r0</text>
<text x="131.0" y="164" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">(e0, v3) × 1500</text>
<rect x="36" y="266" width="190" height="48" rx="10" fill="#fde6dc" stroke="#eb6834" stroke-width="1.5"/>
<text x="131.0" y="287" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="middle">r3</text>
<text x="131.0" y="304" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">(e0, v1) × 1000</text>
<rect x="380" y="90" width="120" height="90" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<rect x="380" y="190" width="120" height="90" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<rect x="380" y="290" width="120" height="90" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="440" y="108" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">c0 · 100 ms</text>
<rect x="392" y="118" width="96" height="24" rx="6" fill="#fcf0d4" stroke="#eda100" stroke-width="1.2"/>
<text x="440" y="134" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">x[c0, v3]</text>
<rect x="392" y="148" width="96" height="24" rx="6" fill="#fcf0d4" stroke="#eda100" stroke-width="1.2"/>
<text x="440" y="164" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">x[c0, v1]</text>
<text x="440" y="208" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">c2 · 200 ms</text>
<rect x="392" y="218" width="96" height="24" rx="6" fill="#fcf0d4" stroke="#eda100" stroke-width="1.2"/>
<text x="440" y="234" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">x[c2, v3]</text>
<rect x="392" y="248" width="96" height="24" rx="6" fill="#fcf0d4" stroke="#eda100" stroke-width="1.2"/>
<text x="440" y="264" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">x[c2, v1]</text>
<text x="440" y="308" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">c1 · 300 ms</text>
