<text x="440" y="334" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">x[c1, v3]</text>
<rect x="392" y="348" width="96" height="24" rx="6" fill="#fcf0d4" stroke="#eda100" stroke-width="1.2"/>
<text x="440" y="364" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">x[c1, v1]</text>
<line x1="226" y1="150" x2="390" y2="130" stroke="#52514e" stroke-width="1.2" marker-end="url(#m-ink)"/>
<line x1="226" y1="150" x2="390" y2="230" stroke="#52514e" stroke-width="1.2" marker-end="url(#m-ink)"/>
<line x1="226" y1="150" x2="390" y2="330" stroke="#52514e" stroke-width="1.2" marker-end="url(#m-ink)"/>
<line x1="226" y1="290" x2="390" y2="160" stroke="#52514e" stroke-width="1.2" marker-end="url(#m-ink)"/>
<line x1="226" y1="290" x2="390" y2="260" stroke="#52514e" stroke-width="1.2" marker-end="url(#m-ink)"/>
<line x1="226" y1="290" x2="390" y2="360" stroke="#52514e" stroke-width="1.2" marker-end="url(#m-ink)"/>
<text x="36" y="96" font-size="12" font-weight="600" fill="#52514e" text-anchor="start">each line: “this cache could serve this request”</text>
<text x="36" y="368" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">r1 (e1, v0): no faster cache → no variable.</text>
<text x="36" y="385" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">r2 (e0, v4): too big → no variable.</text>
<rect x="540" y="84" width="392" height="196" rx="10" fill="#fcf0d4" stroke="#eda100" stroke-width="1.5"/>
<text x="556" y="108" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">The choices</text>
<text x="556" y="128" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">x: copy this video into this cache, yes or no?</text>
<text x="556" y="146" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">y: which cache serves this request?</text>
<text x="556" y="176" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">The goal</text>
<text x="556" y="196" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">as much time saved as possible, in total</text>
<text x="556" y="224" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">The rules</text>
<text x="556" y="244" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">a request is served once, only by a cache that</text>
<text x="556" y="262" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">holds the video; no cache over its size</text>
<text x="540" y="310" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Used when y ≤ 50,000 (solve.py):</text>
<text x="540" y="330" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">• me_at_the_zoo: 261 y → proven optimum 516,557 in 3 s</text>
<text x="540" y="350" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">• small class instances: proven optimum in &lt; 1 s</text>
<text x="540" y="370" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">• videos_worth_spreading: 211k y → too slow, but proves</text>
<text x="540" y="390" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">  that no answer can beat 620,009 (an upper bound)</text>
</svg>
