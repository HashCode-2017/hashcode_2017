<svg xmlns="http://www.w3.org/2000/svg" width="960" height="344" viewBox="0 0 960 344" role="img" aria-label="Greedy by ratio versus an exact knapsack" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
<title>Greedy by ratio versus an exact knapsack</title>
<defs><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#008300"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e34948"/></marker><marker id="m-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6250d6"/></marker><marker id="m-aqua" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1baf7a"/></marker><marker id="m-magenta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c94f7f"/></marker><marker id="m-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b07800"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fbe2e2"/><line x1="0" y1="0" x2="0" y2="8" stroke="#e34948" stroke-width="2" opacity="0.55"/></pattern></defs>
<rect x="0.5" y="0.5" width="959" height="343" rx="14" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28" y="39" font-size="20" font-weight="700" fill="#0b0b0b" text-anchor="start">Why the greedy is not enough: the ratio trap</text>
<text x="28" y="64" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">One cache of 10 MB. Choosing by saving per MB is not the best knapsack.</text>
<text x="40" y="100" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">videos</text>
<rect x="40" y="114" width="178" height="32" rx="4" fill="#6250d6"/>
<text x="130.0" y="135" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">A · 6 MB</text>
<text x="230" y="135" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">saves 600 · 100 / MB</text>
<rect x="40" y="160" width="148" height="32" rx="4" fill="#2a78d6"/>
<text x="115.0" y="181" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">B · 5 MB</text>
<text x="200" y="181" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">saves 450 · 90 / MB</text>
<rect x="40" y="206" width="148" height="32" rx="4" fill="#2a78d6"/>
<text x="115.0" y="227" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">C · 5 MB</text>
<text x="200" y="227" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">saves 450 · 90 / MB</text>
<text x="470" y="100" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">Greedy (best ratio first)</text>
<rect x="470" y="114" width="178" height="36" rx="4" fill="#6250d6"/>
<text x="560" y="137" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
<rect x="650" y="114" width="120" height="36" rx="4" fill="url(#hatch)" stroke="#e34948" stroke-width="1"/>
<text x="710" y="137" font-size="12" font-weight="700" fill="#e34948" text-anchor="middle">4 MB wasted</text>
<text x="786" y="138" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">600</text>
<text x="470" y="172" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">takes A first; then neither B nor C (5 MB) fits in 4 MB</text>
<text x="470" y="214" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">Exact knapsack (stage 2)</text>
<rect x="470" y="228" width="148" height="36" rx="4" fill="#2a78d6"/>
<text x="545.0" y="251" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
<rect x="620" y="228" width="148" height="36" rx="4" fill="#2a78d6"/>
<text x="695.0" y="251" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
<text x="786" y="252" font-size="22" font-weight="700" fill="#008300" text-anchor="start">900</text>
<text x="470" y="286" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">tries every combination (by DP) and keeps the best</text>
<text x="40" y="300" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">PIPELINE.md: some class instances (4_2_4_2, 6_2_6_2 …) are built on this trap;</text>
<text x="40" y="320" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">the greedy reaches only 50–66 % of their optimum there.</text>
</svg>
