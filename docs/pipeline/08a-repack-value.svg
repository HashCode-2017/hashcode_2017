<svg xmlns="http://www.w3.org/2000/svg" width="960" height="436" viewBox="0 0 960 436" role="img" aria-label="How re-pack values a video in one cache" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
<title>How re-pack values a video in one cache</title>
<defs><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#008300"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e34948"/></marker><marker id="m-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6250d6"/></marker><marker id="m-aqua" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1baf7a"/></marker><marker id="m-magenta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c94f7f"/></marker><marker id="m-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b07800"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fbe2e2"/><line x1="0" y1="0" x2="0" y2="8" stroke="#e34948" stroke-width="2" opacity="0.55"/></pattern></defs>
<rect x="0.5" y="0.5" width="959" height="435" rx="14" fill="#fcfcfb" stroke="#e4e3df"/>
<rect x="28" y="20" width="140" height="22" rx="11.0" fill="#dcf3ea" stroke="#1baf7a" stroke-width="1.2"/>
<text x="98" y="35" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">STAGE 2 · RE-PACK</text>
<text x="180" y="39" font-size="20" font-weight="700" fill="#0b0b0b" text-anchor="start">Re-pack, part 1: how useful is a video in THIS cache?</text>
<text x="28" y="64" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">The other caches are locked. A copy here is only worth the time it saves on top of what users already get.</text>
<rect x="28" y="84" width="280" height="300" rx="12" fill="#fcfcfb" stroke="#e4e3df" stroke-width="1.5"/>
<text x="44" y="112" font-size="14.5" font-weight="700" fill="#0b0b0b" text-anchor="start">Nobody nearby has it</text>
<rect x="44" y="130" width="116" height="46" rx="10" fill="#dcf3ea" stroke="#1baf7a" stroke-width="1.5"/>
<text x="102.0" y="150" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="middle">this cache</text>
<text x="102.0" y="167" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">100 ms</text>
<rect x="176" y="130" width="116" height="46" rx="10" fill="#f1f0ec" stroke="#52514e" stroke-width="1.5"/>
<text x="234.0" y="150" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="middle">data center</text>
<text x="234.0" y="167" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">1000 ms</text>
<rect x="108" y="212" width="120" height="36" rx="10" fill="#fde6dc" stroke="#eb6834" stroke-width="1.5"/>
<text x="168.0" y="235" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="middle">users</text>
<line x1="152" y1="212" x2="102" y2="176" stroke="#2a78d6" stroke-width="1.5"/>
<line x1="184" y1="212" x2="234" y2="176" stroke="#52514e" stroke-width="1.5"/>
<text x="44" y="276" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Without this copy: 1000 ms</text>
<text x="44" y="295" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">(the data center).</text>
<text x="44" y="314" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">With it: 100 ms.</text>
<text x="44" y="333" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Saves 900 ms per request.</text>
<rect x="44" y="350" width="97" height="22" rx="11.0" fill="#e0f0e0" stroke="#008300" stroke-width="1.2"/>
<text x="93" y="365" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">very useful</text>
<rect x="340" y="84" width="280" height="300" rx="12" fill="#fcfcfb" stroke="#e4e3df" stroke-width="1.5"/>
<text x="356" y="112" font-size="14.5" font-weight="700" fill="#0b0b0b" text-anchor="start">Another cache has it, slower</text>
<rect x="356" y="130" width="116" height="46" rx="10" fill="#dcf3ea" stroke="#1baf7a" stroke-width="1.5"/>
<text x="414.0" y="150" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="middle">this cache</text>
<text x="414.0" y="167" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">100 ms</text>
<rect x="488" y="130" width="116" height="46" rx="10" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="546.0" y="150" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="middle">other cache</text>
<text x="546.0" y="167" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">200 ms</text>
<rect x="420" y="212" width="120" height="36" rx="10" fill="#fde6dc" stroke="#eb6834" stroke-width="1.5"/>
<text x="480.0" y="235" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="middle">users</text>
<line x1="464" y1="212" x2="414" y2="176" stroke="#2a78d6" stroke-width="1.5"/>
<line x1="496" y1="212" x2="546" y2="176" stroke="#2a78d6" stroke-width="1.5"/>
<text x="356" y="276" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Without this copy: 200 ms</text>
<text x="356" y="295" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">(the other cache).</text>
<text x="356" y="314" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">With it: 100 ms.</text>
<text x="356" y="333" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Saves only 100 ms per request.</text>
<rect x="356" y="350" width="126" height="22" rx="11.0" fill="#fcf0d4" stroke="#eda100" stroke-width="1.2"/>
<text x="419" y="365" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">a little useful</text>
<rect x="652" y="84" width="280" height="300" rx="12" fill="#fcfcfb" stroke="#e4e3df" stroke-width="1.5"/>
<text x="668" y="112" font-size="14.5" font-weight="700" fill="#0b0b0b" text-anchor="start">Another cache has it, faster</text>
<rect x="668" y="130" width="116" height="46" rx="10" fill="#dcf3ea" stroke="#1baf7a" stroke-width="1.5"/>
<text x="726.0" y="150" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="middle">this cache</text>
<text x="726.0" y="167" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">100 ms</text>
<rect x="800" y="130" width="116" height="46" rx="10" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="858.0" y="150" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="middle">other cache</text>
<text x="858.0" y="167" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">50 ms</text>
<rect x="732" y="212" width="120" height="36" rx="10" fill="#fde6dc" stroke="#eb6834" stroke-width="1.5"/>
<text x="792.0" y="235" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="middle">users</text>
<line x1="776" y1="212" x2="726" y2="176" stroke="#2a78d6" stroke-width="1.5"/>
<line x1="808" y1="212" x2="858" y2="176" stroke="#2a78d6" stroke-width="1.5"/>
<text x="668" y="276" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Users already get it in 50 ms.</text>
<text x="668" y="295" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">This copy (100 ms) would</text>
<text x="668" y="314" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">never be used.</text>
<text x="668" y="333" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Saves nothing.</text>
<rect x="668" y="350" width="104" height="22" rx="11.0" fill="#fbe2e2" stroke="#e34948" stroke-width="1.2"/>
<text x="720" y="365" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">useless here</text>
<text x="480" y="412" font-size="13" font-weight="600" fill="#52514e" text-anchor="middle">Add this up over all the cache&#x27;s users and all their requests: each video gets one number, its value in this cache.</text>
</svg>
