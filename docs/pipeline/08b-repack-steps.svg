<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-label="Re-pack, step by step" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
<title>Re-pack, step by step</title>
<defs><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#008300"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e34948"/></marker><marker id="m-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6250d6"/></marker><marker id="m-aqua" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1baf7a"/></marker><marker id="m-magenta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c94f7f"/></marker><marker id="m-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b07800"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fbe2e2"/><line x1="0" y1="0" x2="0" y2="8" stroke="#e34948" stroke-width="2" opacity="0.55"/></pattern></defs>
<rect x="0.5" y="0.5" width="959" height="469" rx="14" fill="#fcfcfb" stroke="#e4e3df"/>
<rect x="28" y="20" width="140" height="22" rx="11.0" fill="#dcf3ea" stroke="#1baf7a" stroke-width="1.2"/>
<text x="98" y="35" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">STAGE 2 · RE-PACK</text>
<text x="180" y="39" font-size="20" font-weight="700" fill="#0b0b0b" text-anchor="start">Re-pack, part 2: refill the cache with the best combination</text>
<text x="28" y="64" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">Example: one cache of 10 MB that the greedy filled with A only.</text>
<rect x="28" y="84" width="214" height="280" rx="12" fill="#fcfcfb" stroke="#e4e3df" stroke-width="1.5"/>
<text x="42" y="110" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="start">1 · Lock the others</text>
<line x1="244" y1="224" x2="256" y2="224" stroke="#1baf7a" stroke-width="1.5" marker-end="url(#m-aqua)"/>
<rect x="258" y="84" width="214" height="280" rx="12" fill="#fcfcfb" stroke="#e4e3df" stroke-width="1.5"/>
<text x="272" y="110" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="start">2 · Value of each video</text>
<line x1="474" y1="224" x2="486" y2="224" stroke="#1baf7a" stroke-width="1.5" marker-end="url(#m-aqua)"/>
<rect x="488" y="84" width="214" height="280" rx="12" fill="#fcfcfb" stroke="#e4e3df" stroke-width="1.5"/>
<text x="502" y="110" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="start">3 · Best combo for 10 MB</text>
<line x1="704" y1="224" x2="716" y2="224" stroke="#1baf7a" stroke-width="1.5" marker-end="url(#m-aqua)"/>
<rect x="718" y="84" width="214" height="280" rx="12" fill="#fcfcfb" stroke="#e4e3df" stroke-width="1.5"/>
<text x="732" y="110" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="start">4 · Better? Replace</text>
<rect x="42" y="134" width="32" height="32" rx="6" fill="#f1f0ec" stroke="#c9c8c2" stroke-width="1"/>
<rect x="80" y="134" width="32" height="32" rx="6" fill="#f1f0ec" stroke="#c9c8c2" stroke-width="1"/>
<rect x="118" y="134" width="32" height="32" rx="6" fill="#dcf3ea" stroke="#1baf7a" stroke-width="2"/>
<rect x="156" y="134" width="32" height="32" rx="6" fill="#f1f0ec" stroke="#c9c8c2" stroke-width="1"/>
<rect x="194" y="134" width="32" height="32" rx="6" fill="#f1f0ec" stroke="#c9c8c2" stroke-width="1"/>
<text x="134" y="186" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">this one</text>
<text x="58" y="186" font-size="11.5" font-weight="400" fill="#8a8984" text-anchor="middle">locked</text>
<text x="210" y="186" font-size="11.5" font-weight="400" fill="#8a8984" text-anchor="middle">locked</text>
<text x="42" y="230" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Only this cache may change.</text>
<text x="42" y="249" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">All other caches stay exactly</text>
<text x="42" y="268" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">as they are for now, so each</text>
<text x="42" y="287" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">video&#x27;s value here is a fixed</text>
<text x="42" y="306" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">number.</text>
<rect x="272" y="128" width="84" height="28" rx="4" fill="#6250d6"/>
<text x="314" y="147" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">A · 6 MB</text>
<text x="366" y="147" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="start">worth 600</text>
<rect x="272" y="166" width="70" height="28" rx="4" fill="#2a78d6"/>
<text x="307" y="185" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">B · 5 MB</text>
<text x="366" y="185" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="start">worth 450</text>
<rect x="272" y="204" width="70" height="28" rx="4" fill="#2a78d6"/>
<text x="307" y="223" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">C · 5 MB</text>
<text x="366" y="223" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="start">worth 450</text>
<text x="272" y="262" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Worked out as in part 1:</text>
<text x="272" y="281" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">the time it saves on top of</text>
<text x="272" y="300" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">what users already get.</text>
<text x="502" y="138" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">A alone: 600</text>
<text x="502" y="156" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">B or C no longer fits next to A</text>
<text x="502" y="186" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">A + B: 11 MB, too big</text>
<text x="502" y="216" font-size="13" font-weight="700" fill="#008300" text-anchor="start">B + C: 900  ✓ the best</text>
<text x="502" y="262" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">A table checks all the</text>
<text x="502" y="281" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">combinations quickly</text>
<text x="502" y="300" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">(next figure).</text>
<text x="732" y="136" font-size="12" font-weight="600" fill="#52514e" text-anchor="start">now</text>
<rect x="732" y="142" width="88" height="26" rx="4" fill="#6250d6"/>
<text x="777" y="160" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
<rect x="822" y="142" width="60" height="26" rx="4" fill="url(#hatch)" stroke="#e34948" stroke-width="1"/>
<text x="892" y="160" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="start">600</text>
<text x="732" y="192" font-size="12" font-weight="600" fill="#52514e" text-anchor="start">best</text>
<rect x="732" y="198" width="73" height="26" rx="4" fill="#2a78d6"/>
<text x="769.5" y="216" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
<rect x="807" y="198" width="73" height="26" rx="4" fill="#2a78d6"/>
<text x="844.5" y="216" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
<text x="892" y="216" font-size="14" font-weight="700" fill="#008300" text-anchor="start">900</text>
<text x="732" y="262" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">900 is more than 600:</text>
<text x="732" y="281" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">empty the cache and put</text>
<text x="732" y="300" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">in B and C instead.</text>
<path d="M825.0,364 V392 H135.0 V368" fill="none" stroke="#1baf7a" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m-aqua)"/>
<text x="480" y="386" font-size="12.5" font-weight="600" fill="#52514e" text-anchor="middle">then the next cache</text>
<text x="46" y="422" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Changing one cache changes what videos are worth in its neighbours, so the solver goes round all caches again and again</text>
<text x="46" y="442" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">until a full round changes nothing.  Why “perfect”: with the others locked, no other set of videos for this cache saves more time.</text>
</svg>
