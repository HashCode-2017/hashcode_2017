<text x="46" y="350" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">Reading</text>
<text x="130" y="350" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">Start bottom-right (all videos, 10 MB): shaded, so C is in and 5 MB is left. In B&#x27;s row at 5 MB:</text>
<text x="130" y="370" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">shaded, so B is in and 0 MB is left. A&#x27;s row at 0 MB is not shaded, so A is out. Answer: B + C = 900.</text>
