<text x="130" y="278" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">Rows add one video at a time. For each cell there are two choices: leave the new video out</text>
<text x="130" y="298" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">(keep the value just above), or put it in (its value + the best value for the space that is left).</text>
