<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-label="What the solver remembers" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
<title>What the solver remembers</title>
<defs><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#008300"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e34948"/></marker><marker id="m-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6250d6"/></marker><marker id="m-aqua" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1baf7a"/></marker><marker id="m-magenta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c94f7f"/></marker><marker id="m-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b07800"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fbe2e2"/><line x1="0" y1="0" x2="0" y2="8" stroke="#e34948" stroke-width="2" opacity="0.55"/></pattern></defs>
<rect x="0.5" y="0.5" width="959" height="649" rx="14" fill="#fcfcfb" stroke="#e4e3df"/>
<text x="28" y="39" font-size="20" font-weight="700" fill="#0b0b0b" text-anchor="start">What the code remembers</text>
<text x="28" y="64" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">Built once while reading the file, then kept up to date after every change. Values: the example&#x27;s end state.</text>
<rect x="28" y="84" width="440" height="262" rx="12" fill="#fcfcfb" stroke="#e4e3df" stroke-width="1.5"/>
<text x="46" y="110" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">1 · The requests</text>
<text x="46" y="130" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">Lines for the same (endpoint, video) are added together.</text>
<text x="60" y="160" font-size="12" font-weight="600" fill="#8a8984" text-anchor="start">who</text>
<text x="170" y="160" font-size="12" font-weight="600" fill="#8a8984" text-anchor="start">video</text>
<text x="320" y="160" font-size="12" font-weight="600" fill="#8a8984" text-anchor="end">requests</text>
<text x="440" y="160" font-size="12" font-weight="600" fill="#8a8984" text-anchor="end">data center</text>
<text x="60" y="186" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Endpoint 0</text>
<text x="170" y="186" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="start">v3</text>
<text x="320" y="186" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="end">1500</text>
<text x="440" y="186" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="end">1000 ms</text>
<text x="60" y="212" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Endpoint 1</text>
<text x="170" y="212" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="start">v0</text>
<text x="320" y="212" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="end">1000</text>
<text x="440" y="212" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="end">500 ms</text>
<text x="60" y="238" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Endpoint 0</text>
<text x="170" y="238" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="start">v4</text>
<text x="320" y="238" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="end">500</text>
<text x="440" y="238" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="end">1000 ms</text>
<text x="60" y="264" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Endpoint 0</text>
<text x="170" y="264" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="start">v1</text>
<text x="320" y="264" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="end">1000</text>
<text x="440" y="264" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="end">1000 ms</text>
<text x="46" y="304" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">It also keeps, for each endpoint, its caches sorted</text>
<text x="46" y="322" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">from fastest to slowest.</text>
<rect x="492" y="84" width="440" height="262" rx="12" fill="#fcfcfb" stroke="#e4e3df" stroke-width="1.5"/>
<text x="510" y="110" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">2 · What is in each cache</text>
<text x="510" y="130" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">A yes / no table: is this video in this cache?</text>
<text x="603.0" y="160" font-size="12" font-weight="600" fill="#8a8984" text-anchor="middle">v0</text>
<text x="649.0" y="160" font-size="12" font-weight="600" fill="#8a8984" text-anchor="middle">v1</text>
<text x="695.0" y="160" font-size="12" font-weight="600" fill="#8a8984" text-anchor="middle">v2</text>
<text x="741.0" y="160" font-size="12" font-weight="600" fill="#8a8984" text-anchor="middle">v3</text>
<text x="787.0" y="160" font-size="12" font-weight="600" fill="#8a8984" text-anchor="middle">v4</text>
<text x="568" y="188" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="end">cache 0</text>
<rect x="582" y="170" width="42" height="26" rx="4" fill="#f1f0ec"/>
<rect x="628" y="170" width="42" height="26" rx="4" fill="#2a78d6"/>
<text x="649.0" y="188" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">yes</text>
<rect x="674" y="170" width="42" height="26" rx="4" fill="#f1f0ec"/>
<rect x="720" y="170" width="42" height="26" rx="4" fill="#2a78d6"/>
<text x="741.0" y="188" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">yes</text>
<rect x="766" y="170" width="42" height="26" rx="4" fill="#f1f0ec"/>
<text x="822" y="188" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">20 MB free</text>
<text x="568" y="218" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="end">cache 1</text>
<rect x="582" y="200" width="42" height="26" rx="4" fill="#f1f0ec"/>
<rect x="628" y="200" width="42" height="26" rx="4" fill="#f1f0ec"/>
<rect x="674" y="200" width="42" height="26" rx="4" fill="#f1f0ec"/>
<rect x="720" y="200" width="42" height="26" rx="4" fill="#f1f0ec"/>
<rect x="766" y="200" width="42" height="26" rx="4" fill="#f1f0ec"/>
<text x="822" y="218" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">100 MB free</text>
<text x="568" y="248" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="end">cache 2</text>
<rect x="582" y="230" width="42" height="26" rx="4" fill="#f1f0ec"/>
<rect x="628" y="230" width="42" height="26" rx="4" fill="#f1f0ec"/>
<rect x="674" y="230" width="42" height="26" rx="4" fill="#f1f0ec"/>
<rect x="720" y="230" width="42" height="26" rx="4" fill="#f1f0ec"/>
<rect x="766" y="230" width="42" height="26" rx="4" fill="#f1f0ec"/>
<text x="822" y="248" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">100 MB free</text>
<text x="510" y="304" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Checking, adding or removing a copy is instant,</text>
<text x="510" y="322" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">and so is knowing how much space is left.</text>
<rect x="28" y="362" width="904" height="268" rx="12" fill="#fcfcfb" stroke="#e4e3df" stroke-width="1.5"/>
<text x="46" y="388" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">3 · How fast each request is served right now</text>
<text x="46" y="408" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">The memory of what is already saved: a new copy only counts for the time it saves below this.</text>
<text x="60" y="438" font-size="12" font-weight="600" fill="#8a8984" text-anchor="start">request</text>
<text x="300" y="438" font-size="12" font-weight="600" fill="#8a8984" text-anchor="end">best now</text>
<text x="330" y="438" font-size="12" font-weight="600" fill="#8a8984" text-anchor="start">given by</text>
<text x="590" y="438" font-size="12" font-weight="600" fill="#8a8984" text-anchor="end">next best</text>
<text x="60" y="464" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="start">Endpoint 0 · v3</text>
<text x="300" y="464" font-size="13.5" font-weight="700" fill="#0b0b0b" text-anchor="end">100 ms</text>
<text x="330" y="464" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">cache 0</text>
<text x="590" y="464" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="end">1000 ms</text>
<text x="60" y="490" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="start">Endpoint 1 · v0</text>
<text x="300" y="490" font-size="13.5" font-weight="700" fill="#0b0b0b" text-anchor="end">500 ms</text>
<text x="330" y="490" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">data center</text>
<text x="590" y="490" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="end">–</text>
<text x="60" y="516" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="start">Endpoint 0 · v4</text>
<text x="300" y="516" font-size="13.5" font-weight="700" fill="#0b0b0b" text-anchor="end">1000 ms</text>
<text x="330" y="516" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">data center</text>
<text x="590" y="516" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="end">–</text>
<text x="60" y="542" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="start">Endpoint 0 · v1</text>
<text x="300" y="542" font-size="13.5" font-weight="700" fill="#0b0b0b" text-anchor="end">100 ms</text>
<text x="330" y="542" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">cache 0</text>
<text x="590" y="542" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="end">1000 ms</text>
<rect x="630" y="426" width="284" height="120" rx="10" fill="#dcf3ea" stroke="#1baf7a" stroke-width="1.5"/>
<text x="646" y="450" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Why also keep the next best?</text>
<text x="646" y="468" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Swap and re-pack keep asking “if this</text>
<text x="646" y="486" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">copy were removed, how slow would it</text>
<text x="646" y="504" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">get?” The answer is just the next best,</text>
<text x="646" y="522" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">no searching needed.</text>
<text x="46" y="584" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">When a copy is placed, “best now” drops for the requests it speeds up.</text>
<text x="46" y="602" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">When a copy is removed, the next best takes its place.</text>
</svg>
